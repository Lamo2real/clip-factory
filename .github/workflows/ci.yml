# Checks every push and pull request. Offline only: never calls AWS or Bedrock, needs no secrets.
# The jobs run in parallel (the browser tests as 6 shards); a newer push to the same branch cancels the older
# run. The desktop job (Tauri, desktop/) runs only when desktop/ changed, since it needs the Linux web view
# libraries and a Rust build.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"
  TERRAFORM_VERSION: "1.15.8"

jobs:
  # The web checks are three jobs. Branch protection requires the check named `web`, which is the small gate
  # at the end: it passes only when web-checks and every web-e2e shard passed.
  web-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The committed help corpus, the docs routes table and CONTRACTS §19.6 must match the app routes.
      - name: help corpus is up to date
        run: node scripts/help-corpus.mjs --check
      # Ask's knowledge pack and library (api/src/clipfactory_api/ask, CONTRACTS §27.2) match the docs and the corpus,
      # pass the secrets filter and stay under 110k tokens.
      - name: Ask knowledge is up to date
        run: node scripts/ask-knowledge.mjs --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # About 760 Playwright tests at many widths took 32 to 40 minutes as one job. Playwright splits them evenly
  # over the shards below (fullyParallel, so it splits test by test); each shard builds the mock app once and
  # runs its share with 4 workers on the 4-CPU runner. To add a shard, add a number to the list: the total is
  # read from the matrix size.
  web-e2e:
    name: web-e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Playwright (mock mode, Chromium), shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -- --shard="$SHARD" --workers=4 --project=chromium --project=screenshots
      - name: upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # WebKit: the Mac app (WKWebView) and the iPhone PWA (Safari). Ask pictures (§26), and the stillness and top-line
  # checks (§20.16, §11.1; the slide check runs in WebKit on a Mac only, nav-smooth.spec.ts). One job of its own, because
  # installing WebKit's system packages can take over 20 minutes on a slow apt mirror; paid once here, not per shard.
  web-e2e-webkit:
    name: web-e2e (WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Playwright (mock mode, WebKit desktop and iPhone)
        run: |
          npx playwright install --with-deps webkit
          npm run e2e -- --project=webkit --project=webkit-phone --workers=4
      - name: upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-webkit
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # The required check. always() makes it report a failure (not "skipped", which branch protection would accept)
  # when a job it needs failed or was cancelled.
  web:
    needs: [web-checks, web-e2e, web-e2e-webkit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: web-checks and every web-e2e shard passed
        env:
          CHECKS: ${{ needs.web-checks.result }}
          E2E: ${{ needs.web-e2e.result }}
          WEBKIT: ${{ needs.web-e2e-webkit.result }}
        run: |
          echo "web-checks: ${CHECKS}"
          echo "web-e2e (all shards): ${E2E}"
          echo "web-e2e (WebKit): ${WEBKIT}"
          [ "$CHECKS" = "success" ] && [ "$E2E" = "success" ] && [ "$WEBKIT" = "success" ]

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      # api/pyproject.toml names no mypy targets, so the package is passed explicitly.
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: build the Lambda package (api/dist/lambda.zip)
        run: uv run python scripts/build_lambda.py
      # The real zip carries the web help corpus byte for byte (§19.10).
      - name: the Lambda package has the help corpus
        run: uv run pytest -q tests/test_help_corpus.py -k zip

  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: lint, types and tests
        working-directory: agent
        run: |
          uv sync --frozen
          uv run ruff check
          uv run ruff format --check
          uv run mypy
          uv run pytest -q
      # The image is built for ARM64 (AgentCore) under QEMU and never pushed; the layer cache lives in GitHub.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: build the agent image (linux/arm64, not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/arm64
          push: false
          provenance: false
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform -chdir=infra fmt -check -recursive
      - name: init (no backend) and validate
        run: |
          for d in infra/envs/prod infra/bootstrap; do
            echo "::group::${d}"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      # Tests plan against mock providers (mock_provider "aws"): no credentials, no AWS calls. Every Terraform
      # root that has *.tftest.hcl files (in tests/ or next to its .tf files) is tested, so a new module's tests
      # (flows, realtime, hooks, vectors, ...) run without editing this list. A failure stops the job.
      - name: terraform test (every module and env with tests, mock providers)
        run: |
          mapfile -t dirs < <(
            find infra -name '*.tftest.hcl' -not -path '*/.terraform/*' -print \
              | sed -E 's#/tests/[^/]+$##; s#/[^/]+\.tftest\.hcl$##' | sort -u
          )
          [ "${#dirs[@]}" -gt 0 ] || { echo "::error::No *.tftest.hcl files found under infra/."; exit 1; }
          for dir in "${dirs[@]}"; do
            echo "::group::terraform test ${dir}"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done
          echo "Tested ${#dirs[@]} Terraform roots: ${dirs[*]}"
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
      - name: tflint
        working-directory: infra
        run: |
          config=()
          if [ -f .tflint.hcl ]; then config=(--config "$PWD/.tflint.hcl"); fi
          tflint --init "${config[@]}"
          tflint --recursive "${config[@]}"

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: shellcheck
        run: shellcheck scripts/*.sh desktop/scripts/*.sh
      - name: release-areas.sh against a throwaway git repository
        run: bash scripts/test-release-areas.sh
      - name: write-web-config.sh against saved Terraform output fixtures (wsUrl required)
        run: bash scripts/test-write-web-config.sh
      - name: ensure-state-bucket.sh against a fake aws (only this account's bucket is used)
        run: bash scripts/test-ensure-state-bucket.sh
      - name: deploy.yml checks (alarm email, no OIDC token in the desktop build, actions pinned to SHAs, delete gate)
        run: bash scripts/test-deploy-workflow.sh
      - name: the delete gate refuses plans that delete or replace the owner's data
        run: bash scripts/test-check-plan-deletes.sh

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.diff.outputs.desktop }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: did desktop/ change
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
          else
            base="$BEFORE"
          fi
          # A new branch (before is all zeros) or a base this clone does not have: check everything.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit; running the desktop checks."
            exit 0
          fi
          if git diff --quiet "$base" "$HEAD_SHA" -- desktop; then
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "desktop/ did not change; skipping the desktop checks."
          else
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Tauri's Linux build dependencies (web view, GTK)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri -> target
          key: ci-linux
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: tauri.conf.json and the capability are valid JSON
        working-directory: desktop
        run: jq -e . src-tauri/tauri.conf.json src-tauri/capabilities/*.json package.json >/dev/null
