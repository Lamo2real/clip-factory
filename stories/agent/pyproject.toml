[project]
name = "lamostories-agent"
version = "0.1.0"
description = "Lamo Stories: its own AgentCore runtime (docs/CONTRACTS.md §45.11, §45.24-§45.31). Imports nothing from Clip Factory's agent."
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.43",
  "starlette>=1.0",
  "uvicorn>=0.35",
  "numpy>=2.2",   # the rasterizer and the sound synthesis
  "deno==2.9.8",  # runs web/src/stories/engine/cli.ts (the same engine the browser draws)
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[project.scripts]
lamostories-agent = "lamostories_agent.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lamostories_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # the shared fakes (tests/ls_fakes.py) import as ``ls_fakes``
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL", "ASYNC"]
ignore = ["E501", "PLC0415", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLR0917", "S101", "S603", "S607", "S108", "ASYNC240", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLC0415", "ASYNC"]

[tool.mypy]
python_version = "3.13"
packages = ["lamostories_agent"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
