[package]
name = "clip-factory-desktop"
version = "1.0.0"
description = "Clip Factory desktop app: a thin native window around the Clip Factory web app"
edition = "2021"
rust-version = "1.90"
publish = false
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2", features = [] }
url = "2"

[dependencies]
# Read by the context tauri::generate_context! builds from tauri.conf.json (its plugins section), and by the tests.
serde_json = "1"
# macos-private-api: a transparent web view on macOS, so the window glass shows through (docs/CONTRACTS.md §22).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
# Mac fetches it (docs/CONTRACTS.md §35): the signed tool manifest (ed25519), file sums, the downloads of the pinned
# tools and the S3 part uploads (blocking reqwest on the fetch's own thread; rustls, as the updater already uses).
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
fs4 = { version = "0.13", features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

# Which Windows build this is, to pick the window glass it can draw smoothly (already used by tauri itself).
[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

# Stops yt-dlp and the ffmpeg it starts as one process group (docs/CONTRACTS.md §35.5).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", default-features = false, features = ["signal"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# No unsafe code, with one exception that is allowed where it stands: main.rs reads AppKit's version number, a
# constant the system exports, to tell macOS Liquid Glass from the older vibrancy (docs/CONTRACTS.md §22.2).
# ("deny", not "forbid", because a forbidden lint cannot be allowed anywhere.)
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
