[project]
name = "clipfactory-agent"
version = "0.1.0"
description = "Clip Factory Cloud: the AgentCore runtime that turns a long video into reviewed vertical clips."
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.43",  # durable callback APIs and the s3vectors client (docs/CONTRACTS.md §14.10)
  "claude-agent-sdk>=0.2.178",
  "starlette>=1.0",
  "uvicorn>=0.35",
  # Pinned: YouTube changes often and a known-good yt-dlp is part of the image. "deno" installs the JavaScript
  # runtime yt-dlp needs for YouTube; "default" brings yt-dlp-ejs (the challenge solver) and friends.
  "yt-dlp[default,deno]==2026.10.26",
  # The PO token plugin for yt-dlp (docs/CONTRACTS.md §29.2). Its server is built into the image from the same tag
  # (agent/Dockerfile, BGUTIL_VERSION): bump the two together.
  "bgutil-ytdlp-pot-provider==2.0.2",
  # Chat hype (docs/CONTRACTS.md §37): the chat box in the picture is measured with numpy, about 20 MB in the image.
  "numpy>=2.2",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",  # Starlette's TestClient
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[project.scripts]
clipfactory-agent = "clipfactory_agent.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipfactory_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL", "ASYNC"]
ignore = [
  "E501",    # the formatter owns line length
  "PLC0415", # lazy imports keep the SDK and boto3 out of pure-logic tests
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLR0917",
  "S101",    # asserts are fine in tests and for invariants
  "S603", "S607", # ffmpeg, ffprobe and yt-dlp run with argument lists, never a shell
  "S108",    # /tmp is the container's scratch space
  "ASYNC240", # small local file operations in the job's scratch folder; the heavy work runs in subprocesses
  "RUF001", "RUF002", "RUF003",  # plain-language text uses typographic dashes and quotes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLC0415", "ASYNC"]

[tool.mypy]
python_version = "3.13"
packages = ["clipfactory_agent"]
mypy_path = "src"
strict = false
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
